version: "3.9"

# ECOSCOL — Stack complète scalable
# - API stateless (scalable horizontalement : docker compose up --scale api=5)
# - PgBouncer : pooling de connexions PostgreSQL (mode transaction)
# - Redis : cache + broker BullMQ
# - Worker : traite les jobs lourds (PDF, notifications) hors du process API

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ecoscol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoscol"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pooling de connexions : indispensable dès que plusieurs instances API tournent
  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ecoscol
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: pgbouncer   # via le pooler, pas directement postgres
      DB_PORT: 5432
      DB_NAME: ecoscol
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - uploads:/app/uploads
      - documents:/app/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    deploy:
      replicas: 1   # auto-scaling cloud : ajuster (ex: --scale api=5)

  worker:
    build:
      context: ./backend
    command: ["node", "src/workers/index.js"]
    environment:
      NODE_ENV: production
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ecoscol
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
    volumes:
      - uploads:/app/uploads
      - documents:/app/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  documents:
