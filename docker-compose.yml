version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ecoscol_db
    environment:
      POSTGRES_DB: ecoscol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecoscol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ecoscol_backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
    command: sh -c "npm run migrate && npm run dev"

  frontend:
    build: ./frontend
    container_name: ecoscol_frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ecoscol_pgdata: